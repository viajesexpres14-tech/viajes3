<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reservas de Viajes</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #2196f3, #6a5acd);
        }

        .login-container {
            width: 100%;
            padding: 20px;
        }

        .login-box {
            width: 100%;
            max-width: 420px;
            margin: auto;
            padding: 35px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.25);
        }

        h1 {
            text-align: center;
            color: #222;
            margin-bottom: 10px;
        }

        .login-subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: bold;
        }

        input {
            display: block;
            width: 100%;
            height: 50px;
            padding: 0 15px;

            border: 2px solid #ddd;
            border-radius: 10px;

            background: #fff;
            color: #111;

            font-size: 16px;
            outline: none;

            position: relative;
            z-index: 10;
        }

        input:focus {
            border-color: #2196f3;
            box-shadow: 0 0 0 3px rgba(33,150,243,0.15);
        }

        input::placeholder {
            color: #999;
        }

        .btn-primary {
            width: 100%;
            height: 50px;

            border: none;
            border-radius: 10px;

            background: #2196f3;
            color: white;

            font-size: 17px;
            font-weight: bold;

            cursor: pointer;
            margin-top: 5px;
        }

        .btn-primary:hover {
            background: #1976d2;
        }

        .mensaje-login {
            text-align: center;
            color: #e53935;
            margin-top: 15px;
            min-height: 20px;
        }

        .registro-link {
            text-align: center;
            margin-top: 25px;
            color: #666;
        }

        .registro-link a {
            color: #2196f3;
            font-weight: bold;
            text-decoration: none;
        }

        .registro-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="login-box">

            <h1>✈️ Reservas de Viajes</h1>

            <p class="login-subtitle">
                Inicia sesión para continuar
            </p>

            <form id="loginForm">

                <div class="form-group">

                    <label for="email">
                        Correo electrónico
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Escribe tu correo"
                        autocomplete="email"
                    >

                </div>

                <div class="form-group">

                    <label for="password">
                        Contraseña
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Escribe tu contraseña"
                        autocomplete="current-password"
                    >

                </div>

                <button
                    type="submit"
                    class="btn-primary"
                >
                    Entrar
                </button>

            </form>

            <p id="mensajeLogin" class="mensaje-login"></p>

            <div class="registro-link">

                ¿No tienes una cuenta?

                <a href="registro.html">
                    Crear cuenta
                </a>

            </div>

        </div>

    </div>


    <script src="login.js"></script>

</body>
</html>
