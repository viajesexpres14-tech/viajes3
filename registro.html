<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #2196f3, #6a5acd);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .box {
            width: 100%;
            max-width: 500px;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,.25);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitulo {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        .campo {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            height: 48px;
            padding: 0 14px;
            border: 2px solid #ddd;
            border-radius: 9px;
            font-size: 16px;
            color: #111;
            background: white;
            outline: none;
        }

        input:focus {
            border-color: #2196f3;
        }

        button {
            width: 100%;
            height: 50px;
            border: 0;
            border-radius: 9px;
            background: #2196f3;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1976d2;
        }

        #mensaje {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }

        .volver {
            text-align: center;
            margin-top: 20px;
        }

        .volver a {
            color: #2196f3;
            text-decoration: none;
            font-weight: bold;
        }

        .cuentas {
            background: #f4f7ff;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 25px;
        }

        .cuentas p {
            margin: 7px 0;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>✈️ Crear cuenta</h1>

    <p class="subtitulo">
        Regístrate para reservar tus viajes
    </p>

    <div class="cuentas">

        <p>
            <strong>Administrador:</strong><br>
            admin@reservas.com<br>
            Admin123
        </p>

        <hr>

        <p>
            <strong>Usuario de prueba:</strong><br>
            usuario@reservas.com<br>
            Usuario123
        </p>

    </div>

    <form id="registroForm">

        <div class="campo">
            <label for="nombre">Nombre completo</label>
            <input
                type="text"
                id="nombre"
                placeholder="Tu nombre"
                required
            >
        </div>

        <div class="campo">
            <label for="email">Correo electrónico</label>
            <input
                type="email"
                id="email"
                placeholder="ejemplo@gmail.com"
                required
            >
        </div>

        <div class="campo">
            <label for="telefono">Teléfono</label>
            <input
                type="tel"
                id="telefono"
                placeholder="3001234567"
                required
            >
        </div>

        <div class="campo">
            <label for="password">Contraseña</label>
            <input
                type="password"
                id="password"
                placeholder="Contraseña"
                required
            >
        </div>

        <div class="campo">
            <label for="confirmarPassword">
                Confirmar contraseña
            </label>

            <input
                type="password"
                id="confirmarPassword"
                placeholder="Repite la contraseña"
                required
            >
        </div>

        <button type="submit">
            Crear cuenta
        </button>

    </form>

    <p id="mensaje"></p>

    <div class="volver">
        <a href="index.html">
            ← Volver a iniciar sesión
        </a>
    </div>

</div>

<script src="login.js"></script>

</body>
</html>
